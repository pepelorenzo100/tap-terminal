<!--
============================================================
TAP TERMINAL
LOGIN
============================================================

Pantalla de inicio de sesión.

La interfaz solamente recopila las credenciales.
La autenticación real es realizada por AuthService
y Laravel Sanctum.
============================================================
-->

<main class="login-page">

  <section class="login-card">

    <!-- =====================================================
         ENCABEZADO
         ===================================================== -->

    <header class="login-header">

      <h1>TAP Terminal</h1>

      <p>
        Iniciar sesión
      </p>

    </header>


    <!-- =====================================================
         MENSAJE DE ERROR
         ===================================================== -->

    @if (errorMessage) {

      <div
        class="error-message"
        role="alert"
      >
        {{ errorMessage }}
      </div>

    }


    <!-- =====================================================
         FORMULARIO
         ===================================================== -->

    <form
      (ngSubmit)="login()"
      #loginForm="ngForm"
      novalidate
    >

      <!-- ===================================================
           EMAIL
           =================================================== -->

      <div class="form-group">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="email"
          placeholder="correo@ejemplo.com"
          required
        >

      </div>


      <!-- ===================================================
           PASSWORD
           =================================================== -->

      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="Contraseña"
          required
        >

      </div>


      <!-- ===================================================
           BOTÓN
           =================================================== -->

      <button
        type="submit"
        [disabled]="loading || loginForm.invalid"
      >

        @if (loading) {
          Iniciando sesión...
        } @else {
          Iniciar sesión
        }

      </button>

    </form>

  </section>

</main>

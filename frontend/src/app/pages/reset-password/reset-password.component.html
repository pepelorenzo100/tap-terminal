<!--
============================================================
TAP TERMINAL
RESTABLECER CONTRASEÑA
============================================================

Archivo:

    frontend/src/app/pages/reset-password/
    reset-password.component.html

Responsabilidad:

    Mostrar el formulario utilizado para establecer una nueva
    contraseña mediante el enlace recibido por correo.

URL esperada:

    /reset-password?token=TOKEN&email=CORREO

Flujo:

    Correo
        ↓
    enlace de recuperación
        ↓
    token + email
        ↓
    nueva contraseña
        ↓
    AuthService.resetPassword()
        ↓
    POST /api/reset-password
        ↓
    Laravel
        ↓
    contraseña actualizada

============================================================
-->

<main class="reset-password-page">

  <section
    class="reset-password-card"
    aria-labelledby="reset-password-title"
  >

    <!-- =====================================================
         ENCABEZADO
         ===================================================== -->

    <header class="reset-password-header">

      <h1 id="reset-password-title">
        TAP Terminal
      </h1>

      @if (!completed) {

        <p>
          Restablecer contraseña
        </p>

      } @else {

        <p>
          Contraseña actualizada
        </p>

      }

    </header>


    <!-- =====================================================
         MENSAJE DE ERROR
         ===================================================== -->

    @if (errorMessage) {

      <div
        class="error-message"
        role="alert"
        aria-live="assertive"
      >
        {{ errorMessage }}
      </div>

    }


    <!-- =====================================================
         MENSAJE DE ÉXITO
         ===================================================== -->

    @if (successMessage) {

      <div
        class="success-message"
        role="status"
        aria-live="polite"
      >
        {{ successMessage }}
      </div>

    }


    <!-- =====================================================
         FORMULARIO
         ===================================================== -->

    @if (!completed) {

      <form
        (ngSubmit)="submit()"
        #resetForm="ngForm"
        novalidate
      >

        <!-- =================================================
             CORREO ELECTRÓNICO
             ================================================= -->

        <div class="form-group">

          <label for="reset-email">
            Correo electrónico
          </label>

          <input
            id="reset-email"
            name="email"
            type="email"
            [(ngModel)]="email"
            autocomplete="email"
            readonly
            aria-readonly="true"
          >

        </div>


        <!-- =================================================
             NUEVA CONTRASEÑA
             ================================================= -->

        <div class="form-group">

          <label for="reset-password">
            Nueva contraseña
          </label>

          <input
            id="reset-password"
            name="password"
            type="password"
            [(ngModel)]="password"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
            minlength="8"
            required
          >

        </div>


        <!-- =================================================
             CONFIRMAR CONTRASEÑA
             ================================================= -->

        <div class="form-group">

          <label for="reset-password-confirmation">
            Confirmar contraseña
          </label>

          <input
            id="reset-password-confirmation"
            name="passwordConfirmation"
            type="password"
            [(ngModel)]="passwordConfirmation"
            autocomplete="new-password"
            placeholder="Repite la contraseña"
            minlength="8"
            required
          >

        </div>


        <!-- =================================================
             BOTÓN RESTABLECER
             ================================================= -->

        <button
          type="submit"
          [disabled]="
            loading ||
            resetForm.invalid ||
            !token ||
            !email
          "
        >

          @if (loading) {

            Restableciendo...

          } @else {

            Restablecer contraseña

          }

        </button>

      </form>

    }


    <!-- =====================================================
         ACCIÓN FINAL
         ===================================================== -->

    @if (completed) {

      <button
        type="button"
        class="primary-button"
        (click)="goToLogin()"
      >
        Ir al inicio de sesión
      </button>

    } @else {

      <button
        type="button"
        class="secondary-button"
        (click)="goToLogin()"
        [disabled]="loading"
      >
        Volver al inicio de sesión
      </button>

    }

  </section>

</main>

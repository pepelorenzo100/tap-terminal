<!--
  ============================================================
  TAP TERMINAL
  NAVBAR
  ============================================================

  Navegación principal.

  Las opciones administrativas solamente se muestran
  cuando el usuario posee la sección correspondiente.

  IMPORTANTE:

      Ocultar un enlace NO constituye seguridad.

  La seguridad real se mantiene mediante:

      Angular AuthGuard
      +
      Laravel Sanctum
      +
      autorización del backend
  ============================================================
-->

<nav class="navbar">


  <!-- ========================================================
       IDENTIDAD
       ======================================================== -->

  <div class="navbar-brand">

    <a
      routerLink="/"
      class="navbar-title"
    >
      TAP Terminal
    </a>

    <span class="navbar-subtitle">
      Sistema de administración
    </span>

  </div>


  <!-- ========================================================
       MENÚ AUTENTICADO
       ======================================================== -->

  @if (isAuthenticated) {

    <div class="navbar-menu">


      <!-- ====================================================
           PRODUCTOS
           ==================================================== -->

      @if (canAccessProducts) {

        <a
          routerLink="/products"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navbar-link"
        >
          Productos
        </a>

      }


      <!-- ====================================================
           USUARIOS
           ==================================================== -->

      @if (canAccessUsers) {

        <a
          routerLink="/users"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navbar-link"
        >
          Usuarios
        </a>

      }


      <!-- ====================================================
           PERFILES DE AUTORIZACIÓN
           ==================================================== -->

      @if (canAccessProfiles) {

        <a
          routerLink="/profiles"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navbar-link"
        >
          Perfiles
        </a>

      }


      <!-- ====================================================
           PERFIL PERSONAL
           ==================================================== -->

      <a
        routerLink="/profile"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="navbar-link"
      >
        Perfil
      </a>


      <!-- ====================================================
           CERRAR SESIÓN
           ==================================================== -->

      <button
        type="button"
        class="navbar-logout"
        (click)="logout()"
      >
        Cerrar sesión
      </button>

    </div>

  }

</nav>

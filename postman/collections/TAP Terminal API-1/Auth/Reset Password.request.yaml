$kind: http-request
description: Restablece la contraseña usando el token recibido por correo (o visto en el log). Pega el token en la variable de colección {{reset_token}} antes de enviar.
url: "{{base_url}}/api/reset-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "email": "pepelorenzo100@gmail.com",
      "token": "{{reset_token}}",
      "password": "NuevaPassword456!",
      "password_confirmation": "NuevaPassword456!"
    }
auth:
  type: noauth
order: 5000
